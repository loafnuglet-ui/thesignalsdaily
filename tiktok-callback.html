<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>TikTok Sign-in · The Signals Daily</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="logo.png" alt="The Signals Daily logo">
    <a class="brand" href="index.html">THE SIGNALS DAILY</a>
  </header>
  <main>
    <article>
      <h1 id="h">TikTok sign-in</h1>
      <p id="msg">Copy this page's full address from the address bar and paste it into the
         Signals Daily Uploader window on your computer.</p>
      <p><button id="copy" style="font:inherit;padding:10px 18px;border-radius:999px;border:0;
         background:#3fb950;color:#05070d;font-weight:700;cursor:pointer">Copy address</button></p>
    </article>
  </main>
  <script>
    var q = new URLSearchParams(location.search);
    if (q.get("error")) {
      document.getElementById("h").textContent = "Sign-in was not completed";
      document.getElementById("msg").textContent = q.get("error_description") || q.get("error");
    }
    document.getElementById("copy").onclick = function () {
      navigator.clipboard.writeText(location.href).then(function () {
        document.getElementById("copy").textContent = "Copied ✓";
      });
    };
  </script>
</body>
</html>
